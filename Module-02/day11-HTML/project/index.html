<!-- A valid index.html homepage with a clear semantic structure: a <header> with the site title and a <nav>; a <main> with a products <section> and an “about” <article>; and a <footer>. No styling yet — structure only.
Requirements
• Start from the full HTML5 boilerplate with a sensible <title>.
• A <header> containing an <h1> and a <nav> of at least three links.

• A <footer> with the location (Bole, Addis Ababa) and a contact link. -->

      </nav>
    </header>

    <main>
      <article>
        <h2>About Habesha Market</h2>
        <p>
          Habesha Market is the best place to get authentic Ethiopian products.
        </p>
      </article>
      <section>
        <h2>Products</h2>
        <ul>
          <li>Buna</li>
          <li>Berbere</li>
          <li>Teff</li>
          <li>Bula</li>
