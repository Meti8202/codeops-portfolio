<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habesha Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-amber-50 text-stone-800 min-h-screen">
    <header class="bg-amber-950 text-amber-50 p-4">
      <div
        class="max-w-5xl mx-auto flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
      >
        <h1 class="text-2xl font-bold">Habesha Recipes</h1>
        <div class="flex flex-col gap-2 sm:flex-row">
          <input
            id="search"
            type="search"
            placeholder="Search by name…"
            class="rounded px-3 py-2 text-stone-900 text-sm"
          />
          <select
            id="category"
            class="rounded px-3 py-2 text-stone-900 text-sm"
          >
            <option value="all">All categories</option>
            <option value="Main">Main</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Bread">Bread</option>
          </select>
        </div>
      </div>
    </header>

    <p
      id="status"
      class="max-w-5xl mx-auto px-4 pt-3 text-sm text-stone-500"
      role="status"
    ></p>

    <main class="max-w-5xl mx-auto px-4 py-6">
      <div class="grid grid-cols-1 lg:grid-cols-[1fr_260px] gap-6">
        <div
          id="recipe-grid"
          class="grid grid-cols-1 sm:grid-cols-2 gap-4"
        ></div>

        <aside class="bg-white border border-amber-200 rounded-lg p-4">
          <h2 class="font-semibold text-lg mb-1">Favorites</h2>
          <p id="summary" class="text-sm text-stone-500 mb-3">
            0 saved · 0 min total
          </p>
          <ul id="fav-list" class="text-sm space-y-2">
            <li class="text-stone-400">No favorites yet</li>
          </ul>
        </aside>
      </div>
    </main>

    <footer
      class="text-center text-sm text-stone-500 py-4 border-t border-amber-200 mt-8"
    >
      @ Habesha Recipes
    </footer>

    <script src="./js/app.js"></script>
  </body>
</html>
